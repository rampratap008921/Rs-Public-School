<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | R.S. Public School</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
color:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#d4a017;
}

.logout-btn{
background:#d4a017;
color:#0B1F4B;
border:none;
padding:10px 18px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.container{
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#0B1F4B;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:700;
color:#d4a017;
}

.modules{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.module{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
text-align:center;
}

.module h3{
color:#0B1F4B;
margin-bottom:15px;
}

.module a{
display:inline-block;
background:#0B1F4B;
color:white;
padding:10px 18px;
border-radius:8px;
text-decoration:none;
}

.module a:hover{
background:#d4a017;
color:#0B1F4B;
}

</style>
</head>

<body>

<div class="header">

<h1>Admin Dashboard</h1>

<button class="logout-btn"
onclick="window.location.href='admin-login.html'">
Logout
</button>

</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Students</h3>
<p>1500</p>
</div>

<div class="card">
<h3>Total Teachers</h3>
<p>50</p>
</div>

<div class="card">
<h3>New Admissions</h3>
<p>120</p>
</div>

<div class="card">
<h3>Notices</h3>
<p>15</p>
</div>

</div>

<div class="modules">

<div class="module">
<h3>Students</h3>
<a href="students.html">Open</a>
</div>

<div class="module">
<h3>Teachers</h3>
<a href="teachers.html">Open</a>
</div>

<div class="module">
<h3>Admissions</h3>
<a href="admissions.html">Open</a>
</div>

<div class="module">
<h3>Attendance</h3>
<a href="attendance-management.html">Open</a>
</div>

<div class="module">
<h3>Fees</h3>
<a href="fees.html">Open</a>
</div>

<div class="module">
<h3>Results</h3>
<a href="results.html">Open</a>
</div>

<div class="module">
<h3>Notices</h3>
<a href="notices.html">Open</a>
</div>

<div class="module">
<h3>Settings</h3>
<a href="settings.html">Open</a>

</div>

</div>

</div>

</body>
</html>
