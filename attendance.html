<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
color:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#d4a017;
}

.container{
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#0B1F4B;
margin-bottom:10px;
}

.card p{
font-size:30px;
font-weight:bold;
color:#d4a017;
}

.filter-box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:25px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

select,input{
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

.table-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0B1F4B;
color:white;
padding:15px;
}

td{
padding:15px;
border-bottom:1px solid #eee;
text-align:center;
}

tr:hover{
background:#f9f9f9;
}

.save-btn{
margin-top:20px;
background:#d4a017;
color:#0B1F4B;
border:none;
padding:12px 25px;
font-weight:bold;
border-radius:8px;
cursor:pointer;
}

.save-btn:hover{
opacity:.9;
}

</style>
</head>
<body>

<div class="header">
<h1>R.S. Public School ERP</h1>
<h3>Attendance Management</h3>
</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Students</h3>
<p>1500</p>
</div>

<div class="card">
<h3>Present</h3>
<p>1420</p>
</div>

<div class="card">
<h3>Absent</h3>
<p>80</p>
</div>

<div class="card">
<h3>Attendance %</h3>
<p>94%</p>
</div>

</div>

<div class="filter-box">

<select>
<option>Select Class</option>
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
</select>

<select>
<option>Select Section</option>
<option>A</option>
<option>B</option>
<option>C</option>
</select>

<input type="date">

</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>Roll No</th>
<th>Student Name</th>
<th>Class</th>
<th>Present</th>
<th>Absent</th>
</tr>
</thead>

<tbody>

<tr>
<td>1</td>
<td>Ram Kumar</td>
<td>10-A</td>
<td><input type="radio" name="s1"></td>
<td><input type="radio" name="s1"></td>
</tr>

<tr>
<td>2</td>
<td>Mohan Singh</td>
<td>10-A</td>
<td><input type="radio" name="s2"></td>
<td><input type="radio" name="s2"></td>
</tr>

<tr>
<td>3</td>
<td>Sohan Verma</td>
<td>10-A</td>
<td><input type="radio" name="s3"></td>
<td><input type="radio" name="s3"></td>
</tr>

<tr>
<td>4</td>
<td>Ravi Gupta</td>
<td>10-A</td>
<td><input type="radio" name="s4"></td>
<td><input type="radio" name="s4"></td>
</tr>

</tbody>

</table>

<button class="save-btn">
Save Attendance
</button>

</div>

</div>

</body>
</html>
