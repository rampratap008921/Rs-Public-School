<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
color:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#d4a017;
}

.container{
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#0B1F4B;
}

.card p{
font-size:28px;
font-weight:bold;
color:#d4a017;
margin-top:10px;
}

.upload-box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:30px;
}

.upload-box h2{
color:#0B1F4B;
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

input,select{
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

.upload-btn{
background:#d4a017;
color:#0B1F4B;
border:none;
padding:12px 25px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.gallery-card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.gallery-card img{
width:100%;
height:200px;
object-fit:cover;
}

.gallery-info{
padding:15px;
}

.gallery-info h4{
color:#0B1F4B;
margin-bottom:8px;
}

.gallery-info p{
color:#666;
font-size:14px;
}

.action{
margin-top:10px;
display:flex;
gap:10px;
}

.btn{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
}

.edit{
background:#d4a017;
color:#0B1F4B;
}

.delete{
background:#dc3545;
color:white;
}

</style>
</head>

<body>

<div class="header">
<h1>R.S. Public School ERP</h1>
<h3>Gallery Management</h3>
</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Photos</h3>
<p>1250</p>
</div>

<div class="card">
<h3>Total Videos</h3>
<p>85</p>
</div>

<div class="card">
<h3>Total Albums</h3>
<p>22</p>
</div>

<div class="card">
<h3>Featured Media</h3>
<p>15</p>
</div>

</div>

<div class="upload-box">

<h2>Upload New Media</h2>

<div class="form-grid">

<input type="text" placeholder="Album Name">

<select>
<option>Select Category</option>
<option>Annual Function</option>
<option>Sports Day</option>
<option>Independence Day</option>
<option>Republic Day</option>
<option>School Tour</option>
<option>Class Activity</option>
</select>

<input type="file">

</div>

<button class="upload-btn">
Upload Media
</button>

</div>

<div class="gallery-grid">

<div class="gallery-card">
<img src="https://picsum.photos/400/250?1">
<div class="gallery-info">
<h4>Annual Function 2026</h4>
<p>Annual Function Album</p>
<div class="action">
<button class="btn edit">Edit</button>
<button class="btn delete">Delete</button>
</div>
</div>
</div>

<div class="gallery-card">
<img src="https://picsum.photos/400/250?2">
<div class="gallery-info">
<h4>Sports Day</h4>
<p>Sports Activity Album</p>
<div class="action">
<button class="btn edit">Edit</button>
<button class="btn delete">Delete</button>
</div>
</div>
</div>

</div>

</div>

</body>
</html>
