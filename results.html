<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
color:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#d4a017;
}

.container{
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#0B1F4B;
margin-bottom:10px;
}

.card p{
font-size:30px;
font-weight:bold;
color:#d4a017;
}

.filter-box{
display:flex;
gap:15px;
flex-wrap:wrap;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

.filter-box select,
.filter-box input{
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

.table-card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0B1F4B;
color:white;
padding:14px;
}

td{
padding:14px;
border-bottom:1px solid #eee;
text-align:center;
}

.pass{
background:#28a745;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.fail{
background:#dc3545;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.action-btn{
background:#d4a017;
color:#0B1F4B;
border:none;
padding:8px 12px;
border-radius:6px;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
<h1>R.S. Public School ERP</h1>
<h3>Result Management</h3>
</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Students</h3>
<p>1500</p>
</div>

<div class="card">
<h3>Passed</h3>
<p>1425</p>
</div>

<div class="card">
<h3>Failed</h3>
<p>75</p>
</div>

<div class="card">
<h3>Pass %</h3>
<p>95%</p>
</div>

</div>

<div class="filter-box">

<select>
<option>Session 2026-27</option>
</select>

<select>
<option>Select Exam</option>
<option>Unit Test</option>
<option>Half Yearly</option>
<option>Annual Exam</option>
</select>

<select>
<option>Select Class</option>
<option>Playway</option>
<option>Nursery</option>
<option>LKG</option>
<option>UKG</option>
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
</select>

<input type="text" placeholder="Search Student">

</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>Roll No</th>
<th>Name</th>
<th>Class</th>
<th>Total</th>
<th>Percentage</th>
<th>Grade</th>
<th>Result</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr>
<td>101</td>
<td>Ram Kumar</td>
<td>10</td>
<td>465</td>
<td>93%</td>
<td>A+</td>
<td><span class="pass">Pass</span></td>
<td><button class="action-btn">Marksheet</button></td>
</tr>

<tr>
<td>102</td>
<td>Mohan Singh</td>
<td>10</td>
<td>425</td>
<td>85%</td>
<td>A</td>
<td><span class="pass">Pass</span></td>
<td><button class="action-btn">Marksheet</button></td>
</tr>

<tr>
<td>103</td>
<td>Sohan Verma</td>
<td>10</td>
<td>170</td>
<td>34%</td>
<td>D</td>
<td><span class="fail">Fail</span></td>
<td><button class="action-btn">Marksheet</button></td>
</tr>

</tbody>

</table>

</div>

</div>

</body>
</html>
