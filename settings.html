<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Settings</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

.header h1{
color:#d4a017;
}

.container{
padding:30px;
}

.section{
background:white;
padding:25px;
border-radius:15px;
margin-bottom:25px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.section h2{
color:#0B1F4B;
margin-bottom:20px;
border-left:5px solid #d4a017;
padding-left:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

textarea{
height:100px;
resize:none;
}

.save-btn{
background:#d4a017;
color:#0B1F4B;
border:none;
padding:14px 30px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.toggle{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:#f7f7f7;
border-radius:8px;
margin-bottom:10px;
}

.status{
color:green;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
<h1>R.S. Public School ERP</h1>
<h3>System Settings</h3>
</div>

<div class="container">

<!-- School Information -->

<div class="section">

<h2>School Information</h2>

<div class="grid">

<input type="text" placeholder="School Name">

<input type="text" placeholder="Principal Name">

<input type="text" placeholder="Phone Number">

<input type="email" placeholder="School Email">

<input type="file">

<input type="file">

</div>

<br>

<textarea placeholder="School Address"></textarea>

</div>

<!-- Academic Settings -->

<div class="section">

<h2>Academic Settings</h2>

<div class="grid">

<input type="text" placeholder="Current Session">

<select>
<option>Playway to Class 10</option>
</select>

<select>
<option>A,B,C,D Sections</option>
</select>

<input type="text" placeholder="Total Subjects">

</div>

</div>

<!-- Student Settings -->

<div class="section">

<h2>Student Settings</h2>

<div class="grid">

<input type="text" placeholder="Admission Prefix (ADM)">

<input type="text" placeholder="Student ID Prefix">

<input type="text" placeholder="Roll Number Format">

</div>

</div>

<!-- Fee Settings -->

<div class="section">

<h2>Fee Settings</h2>

<div class="grid">

<input type="number" placeholder="Late Fee Amount">

<input type="number" placeholder="Transport Fee">

<input type="number" placeholder="Admission Fee">

<input type="number" placeholder="Annual Fee">

</div>

</div>

<!-- Notifications -->

<div class="section">

<h2>Notification Settings</h2>

<div class="toggle">
<span>SMS Notifications</span>
<span class="status">Enabled</span>
</div>

<div class="toggle">
<span>Email Notifications</span>
<span class="status">Enabled</span>
</div>

<div class="toggle">
<span>Push Notifications</span>
<span class="status">Enabled</span>
</div>

</div>

<!-- Security -->

<div class="section">

<h2>Security & Backup</h2>

<div class="toggle">
<span>Database Backup</span>
<button class="save-btn">Backup</button>
</div>

<div class="toggle">
<span>Restore Backup</span>
<button class="save-btn">Restore</button>
</div>

<div class="toggle">
<span>Change Admin Password</span>
<button class="save-btn">Change</button>
</div>

</div>

<button class="save-btn">
Save All Settings
</button>

</div>

</body>
</html>
