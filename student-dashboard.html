<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
color:white;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
font-size:28px;
}

.student-name{
color:#d4a017;
font-weight:600;
}

.container{
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#0B1F4B;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:700;
color:#d4a017;
}

.section{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.section h2{
color:#0B1F4B;
margin-bottom:15px;
}

.notice{
padding:12px;
background:#f4f7fc;
margin-bottom:10px;
border-radius:8px;
}

.logout-btn{
background:#d4a017;
color:#0B1F4B;
padding:10px 20px;
border:none;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

</style>

</head>
<body>

<div class="header">

<h1>Student Dashboard</h1>

<div>
<span class="student-name">
Welcome, Student
</span>

<button class="logout-btn"
onclick="window.location.href='student-login.html'">
Logout
</button>

</div>

</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Attendance</h3>
<p>95%</p>
</div>

<div class="card">
<h3>Pending Fees</h3>
<p>₹0</p>
</div>

<div class="card">
<h3>Result</h3>
<p>88%</p>
</div>

<div class="card">
<h3>Subjects</h3>
<p>8</p>
</div>

</div>

<div class="section">

<h2>Latest Notices</h2>

<div class="notice">
📢 PTM Meeting on Sunday
</div>

<div class="notice">
📢 Summer Vacation from 10 June
</div>

<div class="notice">
📢 Annual Function Registration Open
</div>

</div>

<div class="section">

<h2>Student Profile</h2>

<p><strong>Name:</strong> Student Name</p>
<p><strong>Class:</strong> 10th</p>
<p><strong>Roll No:</strong> 101</p>
<p><strong>Mobile:</strong> 9876543210</p>

</div>

</div>

</body>
</html>
