<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="css/topbar.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Management</title>
<link rel="stylesheet" href="css/sidebar.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
color:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#d4a017;
}

.container{
padding:30px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.search-box{
width:350px;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

.add-btn{
background:#d4a017;
color:#0B1F4B;
padding:12px 20px;
border:none;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.add-btn:hover{
opacity:.9;
}

.table-card{
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#0B1F4B;
color:white;
padding:15px;
text-align:left;
}

td{
padding:15px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#f8f8f8;
}

.edit-btn{
background:#0B1F4B;
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

.delete-btn{
background:#dc3545;
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
margin-left:5px;
}

.status{
background:#28a745;
color:white;
padding:6px 10px;
border-radius:20px;
font-size:12px;
}

</style>
</head>
<body>
<div id="sidebar-container"></div>
<div id="topbar-container"></div>
<div class="header">
<h1>R.S. Public School ERP</h1>
<h3>Student Management</h3>
</div>

<div class="container">

<div class="top-bar">

<input
type="text"
placeholder="Search Student..."
class="search-box">

<button class="add-btn">
+ Add Student
</button>

</div>

<div class="table-card">

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Class</th>
<th>Father Name</th>
<th>Mobile</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr>
<td>1001</td>
<td>Ram Kumar</td>
<td>10th</td>
<td>Shyam Kumar</td>
<td>9876543210</td>
<td><span class="status">Active</span></td>
<td>
<button class="edit-btn">Edit</button>
<button class="delete-btn">Delete</button>
</td>
</tr>

<tr>
<td>1002</td>
<td>Mohan Singh</td>
<td>9th</td>
<td>Raj Singh</td>
<td>9876543211</td>
<td><span class="status">Active</span></td>
<td>
<button class="edit-btn">Edit</button>
<button class="delete-btn">Delete</button>
</td>
</tr>

<tr>
<td>1003</td>
<td>Sohan Verma</td>
<td>8th</td>
<td>Rakesh Verma</td>
<td>9876543212</td>
<td><span class="status">Active</span></td>
<td>
<button class="edit-btn">Edit</button>
<button class="delete-btn">Delete</button>
</td>
</tr>

</tbody>

</table>

</div>

</div>
<script src="js/topbar.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
