<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fc;
}

.header{
background:#0B1F4B;
color:white;
padding:20px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header h1{
color:#d4a017;
}

.logout-btn{
background:#d4a017;
color:#0B1F4B;
border:none;
padding:10px 18px;
border-radius:8px;
font-weight:700;
cursor:pointer;
}

.container{
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
color:#0B1F4B;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:700;
color:#d4a017;
}

.section{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
margin-bottom:20px;
}

.section h2{
color:#0B1F4B;
margin-bottom:15px;
}

.action-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.action-btn{
background:#0B1F4B;
color:white;
padding:15px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:600;
cursor:pointer;
}

.action-btn:hover{
background:#d4a017;
color:#0B1F4B;
}

.notice{
background:#f4f7fc;
padding:12px;
border-radius:8px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="header">

<h1>Teacher Dashboard</h1>

<button class="logout-btn"
onclick="window.location.href='teacher-login.html'">
Logout
</button>

</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Students</h3>
<p>320</p>
</div>

<div class="card">
<h3>Classes Assigned</h3>
<p>5</p>
</div>

<div class="card">
<h3>Subjects</h3>
<p>3</p>
</div>

<div class="card">
<h3>Attendance Today</h3>
<p>95%</p>
</div>

</div>

<div class="section">

<h2>Quick Actions</h2>

<div class="action-grid">

<button class="action-btn">
📅 Mark Attendance
</button>

<button class="action-btn">
📝 Upload Results
</button>

<button class="action-btn">
👨‍🎓 View Students
</button>

<button class="action-btn">
📢 View Notices
</button>

<button class="action-btn">
📚 Subject Management
</button>

<button class="action-btn">
📊 Performance Report
</button>

</div>

</div>

<div class="section">

<h2>Latest Notices</h2>

<div class="notice">
📢 Staff Meeting on Monday
</div>

<div class="notice">
📢 Half Yearly Exam Schedule Published
</div>

<div class="notice">
📢 Result Submission Deadline: 25 June
</div>

</div>

</div>

</body>
</html>
