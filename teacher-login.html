<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Login | R.S. Public School</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(11,31,75,.9),rgba(11,31,75,.9)),url('principal.jpg');
background-size:cover;
background-position:center;
}

.login-box{
width:430px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:20px;
padding:40px;
color:white;
border:1px solid rgba(255,255,255,.15);
}

h1{
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#d4a017;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:6px;
}

.input-group input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
outline:none;
}

.login-btn{
width:100%;
padding:14px;
background:#d4a017;
color:#0B1F4B;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
font-size:16px;
}

.links{
display:flex;
justify-content:space-between;
margin-top:15px;
}

.links a{
color:white;
text-decoration:none;
font-size:14px;
}

</style>
</head>

<body>

<div class="login-box">

<h1>Teacher Login</h1>

<p class="subtitle">
R.S. Public School ERP
</p>

<div class="input-group">
<label>Teacher ID</label>
<input
id="teacherId"
type="text"
placeholder="Enter Teacher ID">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" placeholder="Enter Password">
</div>

<button class="login-btn"
onclick="teacherLogin()">
Login
</button>


<div class="links">
<a href="#">Forgot Password?</a>
<a href="index.html">Back to Website</a>
</div>

</div>
<script>

async function teacherLogin(){

    const teacher_code =
    document.getElementById("teacherId").value.trim();

    if(!teacher_code){

        alert("Enter Teacher ID");
        return;

    }

    try{

        const response = await fetch("http://localhost:5000/api/teachers/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    teacher_code
                })
            }
        );

        const result = await response.json();

        if(result.success){

            localStorage.setItem(
                "teacher",
                JSON.stringify(result.teacher)
            );

            window.location.href =
            "teacher-dashboard.html";

        }else{

            alert("Teacher ID Not Found");

        }

    }catch(error){

        console.error(error);
        alert("Server Connection Error");

    }

}

</script>
</body>
</html>
