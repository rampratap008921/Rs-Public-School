<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Profile | R.S. Public School ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0B1F4B;      /* Navy Blue */
            --accent: #D4A017;       /* Gold */
            --accent-hover: #B88A12; /* Darker Gold */
            --bg-body: #F4F7FC;      /* Soft White Background */
            --bg-card: #FFFFFF;      /* Pure White */
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --error: #EF4444;
            --success: #10B981;
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            position: relative;
        }

        /* Top Action Bar Navigation Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-section h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .brand-section p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .btn-action-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: #F8FAFC;
            border-color: #CBD5E1;
            color: var(--primary);
        }

        .btn-edit {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--primary);
        }

        .btn-edit:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* Profile Layout Shell Structures */
        .profile-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .erp-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(11, 31, 75, 0.04), 0 8px 10px -6px rgba(11, 31, 75, 0.04);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* 1. Header Hero section styling */
        .profile-header-banner {
            background: linear-gradient(135deg, var(--primary) 0%, #1e3a7a 100%);
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 28px;
            border-bottom: 4px solid var(--accent);
            color: #ffffff;
            position: relative;
        }

        .profile-header-banner::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: radial-gradient(circle at 80% 20%, rgba(214, 160, 23, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .default-avatar-icon {
            font-size: 3.5rem;
            color: var(--primary);
        }

        .header-details-block {
            flex-grow: 1;
        }

        .header-details-block h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .teacher-code-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #E2E8F0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 12px;
            vertical-align: middle;
        }

        .badge-active {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-inactive {
            background-color: rgba(239, 108, 108, 0.15);
            color: #F87171;
            border: 1px solid rgba(239, 108, 108, 0.3);
        }

        /* 2. Professional Information Content styling */
        .info-card-body {
            padding: 32px;
        }

        .info-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .info-section-title i {
            color: var(--accent);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px 32px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-item.full-width {
            grid-column: span 3;
        }

        .info-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* 3. Global App States View Styles */
        .state-container {
            padding: 60px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .state-container i {
            font-size: 3.5rem;
            margin-bottom: 8px;
        }

        .state-container h3 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }

        .state-container p {
            color: var(--text-muted);
            max-width: 400px;
            font-size: 0.95rem;
        }

        .spinner-icon {
            color: var(--accent);
            animation: spin 1s linear infinite;
        }

        .error-icon { color: var(--error); }
        .notfound-icon { color: #94A3B8; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Print Override Configurations */
        @media print {
            body {
                background: #ffffff;
                padding: 0;
                color: #000000;
            }
            .top-bar, .btn-action-group, .btn {
                display: none !important;
            }
            .erp-card {
                box-shadow: none !important;
                border: none !important;
            }
            .profile-header-banner {
                background: #ffffff !important;
                color: #000000 !important;
                border-bottom: 2px solid #000000 !important;
                padding: 10px 0 !important;
            }
            .avatar-container {
                border-color: #000000 !important;
            }
            .teacher-code-tag {
                color: #000000 !important;
                background: none !important;
                border: none !important;
                padding: 0 !important;
            }
            .badge {
                border: 1px solid #000000 !important;
                color: #000000 !important;
                background: none !important;
            }
            .info-card-body {
                padding: 20px 0 !important;
            }
        }

        /* Responsive Breakpoints Rules */
        @media (max-width: 992px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .info-item.full-width {
                grid-column: span 2;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 12px;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .btn-action-group {
                width: 100%;
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
            .profile-header-banner {
                flex-direction: column;
                text-align: center;
                padding: 24px;
            }
            .badge {
                margin-left: 0;
                margin-top: 8px;
                display: table;
                margin-right: auto;
            }
            .info-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .info-item.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="brand-section">
                <h1>R.S. Public School ERP</h1>
                <p>Faculty Information Module</p>
            </div>
            <div class="btn-action-group" id="globalActionGroup" style="display: none;">
                <a href="teachers-management.html" class="btn">
                    <i class="fa-solid fa-arrow-left"></i> Back To Management
                </a>
                <button onclick="window.print();" class="btn">
                    <i class="fa-solid fa-print"></i> Print Profile
                </button>
                <a href="#" id="editProfileLink" class="btn btn-edit">
                    <i class="fa-solid fa-user-pen"></i> Edit Teacher
                </a>
            </div>
        </div>

        <div id="viewContainer" class="erp-card">
            </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initializeProfilePipeline();
        });

        // Main Router Core Management System Implementation 
        function initializeProfilePipeline() {
            const container = document.getElementById("viewContainer");
            
            // 1. Render Loading State Screen Component Animation
            showLoadingState(container);

            // 2. Read runtime ID variable parameter from query context string
            const params = new URLSearchParams(window.location.search);
            const teacherId = params.get("id");

            if (!teacherId) {
                showTeacherNotFound();
                return;
            }

            // 3. Fire Asynchronous Query Pipeline Request to Service API Endpoint Gateway URL
            fetch("http://localhost:5000/api/teachers")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP System Error! Status Code: ${response.status}`);
                    }
                    return response.json();
                })
                .then(result => {
                    if (result.success) {
                        // Find data matching target ID
                        const teacher = result.data.find(t => t.id == teacherId);

                        if (!teacher) {
                            showTeacherNotFound();
                            return;
                        }

                        // 4. Executing Dynamic Structural Interface Render Target Pipeline
                        renderTeacherProfile(teacher);
                    } else {
                        showSystemErrorState("System configuration returned an invalid state data pipeline resolution.");
                    }
                })
                .catch(error => {
                    console.error("Critical Interface Exception context captured: ", error);
                    showSystemErrorState("Could not establish a telemetry data connection to the administrative server.");
                });
        }

        // State View Component Engines Implementation
        function showLoadingState(target) {
            target.innerHTML = `
                <div class="state-container">
                    <i class="fa-solid fa-circle-notch spinner-icon"></i>
                    <h3>Synchronizing Core Data</h3>
                    <p>Connecting to the R.S. Public School database cluster. Please wait...</p>
                </div>
            `;
        }

        function showTeacherNotFound() {
            const container = document.getElementById("viewContainer");
            container.innerHTML = `
                <div class="state-container">
                    <i class="fa-solid fa-user-slash notfound-icon"></i>
                    <h3>Teacher Profile Not Found</h3>
                    <p>The system was unable to isolate a corresponding profile index matching the provided verification ID parameters.</p>
                    <div style="margin-top: 8px;">
                        <a href="teachers-management.html" class="btn" style="background-color: var(--primary); color: #fff;">
                            <i class="fa-solid fa-arrow-left"></i> Return to Directory
                        </a>
                    </div>
                </div>
            `;
        }

        function showSystemErrorState(message) {
            const container = document.getElementById("viewContainer");
            container.innerHTML = `
                <div class="state-container">
                    <i class="fa-solid fa-triangle-exclamation error-icon"></i>
                    <h3>API Connection Failure</h3>
                    <p>${message}</p>
                    <div style="margin-top: 8px;">
                        <button onclick="initializeProfilePipeline();" class="btn" style="background-color: var(--error); color: #fff; border:none;">
                            <i class="fa-solid fa-rotate-right"></i> Retry Connection
                        </button>
                    </div>
                </div>
            `;
        }

        // Dynamic Document Composition Engine Matrix
        function renderTeacherProfile(teacher) {
            const container = document.getElementById("viewContainer");
            const actionGroup = document.getElementById("globalActionGroup");
            const editLink = document.getElementById("editProfileLink");

            // Assign parameters explicitly configured within runtime context definitions
            editLink.href = `teacher-edit.html?id=${teacher.id}`;

            // Image fallback implementation logic rule validation
            let photoMarkup = `<i class="fa-solid fa-user-tie default-avatar-icon"></i>`;
            if (teacher.photo && teacher.photo.trim() !== "") {
                photoMarkup = `<img src="${teacher.photo}" alt="${teacher.teacher_name}" class="avatar-img" onerror="this.outerHTML='<i class=\'fa-solid fa-user-tie default-avatar-icon\'></i>'">`;
            }

            // Status Badge conditional assignment logic
            const statusStyle = (teacher.status && teacher.status.toLowerCase() === "active") ? "badge-active" : "badge-inactive";
            const statusValue = teacher.status ? teacher.status : "Inactive";

            // Safe String Null/Empty fallback parser utility
            const parseVal = (value) => (value && value.trim() !== "") ? value : `<span style="color:var(--text-muted); font-style:italic; font-size:0.9rem;">Not Set</span>`;

            // Core Profile Structural Composition Markup Matrix Injection
            container.innerHTML = `
                <div class="profile-header-banner">
                    <div class="avatar-container">
                        ${photoMarkup}
                    </div>
                    <div class="header-details-block">
                        <h2>${parseVal(teacher.teacher_name)} <span class="badge ${statusStyle}">${statusValue}</span></h2>
                        <div class="teacher-code-tag">
                            <i class="fa-solid fa-fingerprint"></i> System Index: ${parseVal(teacher.teacher_code)}
                        </div>
                    </div>
                </div>

                <div class="info-card-body">
                    <h3 class="info-section-title"><i class="fa-solid fa-address-card"></i> Core Identity Details</h3>
                    <div class="info-grid" style="margin-bottom: 40px;">
                        <div class="info-item">
                            <span class="info-label">Database Index ID</span>
                            <span class="info-value">${teacher.id}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Official Employee Name</span>
                            <span class="info-value">${parseVal(teacher.teacher_name)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Father's Full Name</span>
                            <span class="info-value">${parseVal(teacher.father_name)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Gender Classification</span>
                            <span class="info-value">${parseVal(teacher.gender)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Operational System Status</span>
                            <span class="info-value" style="font-weight:700;">${statusValue}</span>
                        </div>
                    </div>

                    <h3 class="info-section-title"><i class="fa-solid fa-network-wired"></i> Deployment & Expertise</h3>
                    <div class="info-grid" style="margin-bottom: 40px;">
                        <div class="info-item">
                            <span class="info-label">Assigned Department</span>
                            <span class="info-value">${parseVal(teacher.department)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Professional Designation</span>
                            <span class="info-value">${parseVal(teacher.designation)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Accredited Qualifications</span>
                            <span class="info-value">${parseVal(teacher.qualification)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Years of Experience</span>
                            <span class="info-value">${parseVal(teacher.experience)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Official Date of Joining</span>
                            <span class="info-value">${parseVal(teacher.joining_date)}</span>
                        </div>
                    </div>

                    <h3 class="info-section-title"><i class="fa-solid fa-id-card-clip"></i> Communication & Contact Telemetry</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">Registered Mobile Terminal</span>
                            <span class="info-value">${parseVal(teacher.mobile)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Official Email Gateway</span>
                            <span class="info-value" style="color:var(--primary); font-weight:600;">${parseVal(teacher.email)}</span>
                        </div>
                        <div></div> <div class="info-item full-width">
                            <span class="info-label">Verified Residential Address</span>
                            <span class="info-value" style="line-height:1.6;">${parseVal(teacher.address)}</span>
                        </div>
                    </div>
                </div>
            `;

            // Reveal action bars on compilation validation pass routing pipeline success state 
            actionGroup.style.display = "flex";
        }
    </script>
</body>
</html>
